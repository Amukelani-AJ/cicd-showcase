{{- /* Written by Amukelani (Claude Sonnet 5.5) on 2026-10-25 — AnalysisTemplate: the canary must keep a high success rate or the rollout aborts */ -}}
{{- /* Modified by Amukelani (Claude Sonnet 5.5) on 2026-10-25 — No data is Inconclusive (pause), not Failed: a frozen node produced an empty sample and rolled back a healthy release */ -}}
{{- if include "cicd-showcase.useRollout" . }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "cicd-showcase.fullname" . }}-success-rate
  labels:
    {{- include "cicd-showcase.labels" . | nindent 4 }}
spec:
  args:
    - name: canary-hash # rollouts-pod-template-hash of the canary ReplicaSet, filled in by the Rollout
  metrics:
    - name: canary-success-rate
      interval: {{ .Values.rollout.analysis.interval }}
      count: {{ .Values.rollout.analysis.count }}
      failureLimit: 0 # a single bad measurement aborts the rollout
      # Three outcomes, on purpose. A measured rate at or above the threshold passes, a measured rate
      # below it fails. An empty or NaN result (no traffic, a scrape gap, a stalled node) satisfies
      # neither condition, so the measurement is Inconclusive and the rollout pauses instead of
      # rolling back or promoting without evidence.
      successCondition: len(result) > 0 && result[0] >= {{ .Values.rollout.analysis.minSuccessRate }}
      failureCondition: len(result) > 0 && result[0] < {{ .Values.rollout.analysis.minSuccessRate }}
      provider:
        prometheus:
          address: {{ .Values.rollout.analysis.prometheusAddress }}
          query: |
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}",path="/",status!~"5.."}[1m]))
            /
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}",path="/"}[1m]))
{{- end }}
