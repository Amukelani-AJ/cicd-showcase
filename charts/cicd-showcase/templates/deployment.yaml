{{- /* Written by Amukelani (Claude Sonnet 5.5) on 2026-10-25 — Deployment for the service (becomes an Argo Rollout in P7) */ -}}
{{- /* Modified by Amukelani (Claude Sonnet 5.5) on 2026-10-25 — Render optional env vars from values */ -}}
{{- /* Modified by Amukelani (Claude Sonnet 5.5) on 2026-10-25 — Use the shared pod template; skipped when the Rollout is used instead */ -}}
{{- if not (include "cicd-showcase.useRollout" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cicd-showcase.fullname" . }}
  labels:
    {{- include "cicd-showcase.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cicd-showcase.selectorLabels" . | nindent 6 }}
  template:
    {{- include "cicd-showcase.podTemplate" . | nindent 4 }}
{{- end }}
