{{- /* Written by Amukelani (Claude Sonnet 5.5) on 2026-10-25 — Deployment for the service (becomes an Argo Rollout in P7) */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cicd-showcase.fullname" . }}
  labels:
    {{- include "cicd-showcase.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cicd-showcase.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cicd-showcase.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
