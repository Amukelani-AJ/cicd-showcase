# Written by Amukelani (Claude Sonnet 5.5) on 2026-10-25 — Default values for the cicd-showcase chart
# Modified by Amukelani (Claude Sonnet 5.5) on 2026-10-25 — Added env, metrics.serviceMonitor and dashboard values
# Modified by Amukelani (Claude Sonnet 5.5) on 2026-10-25 — Added rollout (canary + analysis) and loadgen values
replicaCount: 2

image:
  repository: ghcr.io/amukelani-aj/cicd-showcase
  # GitOps (P5) overwrites this with the immutable sha-<short> tag on every release.
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 8000
  nodePort: 30080 # must match k8s/kind-config.yaml

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

# Pod runs as the same non-root uid the Dockerfile creates.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

probes:
  path: /health
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5

# Extra environment variables for the container, e.g. FAIL_RATE: "0.5" (demo failure injection, see API_DESIGN.md).
env: {}

metrics:
  serviceMonitor:
    # Renders only when enabled AND the cluster has the Prometheus Operator CRDs,
    # so the chart still installs on a bare cluster (CI) without them.
    enabled: false
    interval: 15s

dashboard:
  # A ConfigMap labelled grafana_dashboard=1 that the kube-prometheus-stack Grafana sidecar loads.
  enabled: false

rollout:
  # Uses an Argo Rollout instead of a Deployment, but only when the Rollouts CRD is installed.
  enabled: false
  replicas: 5 # more replicas = finer canary weights, because the weight is the share of pods
  firstWeight: 20
  secondWeight: 60
  pause: 45s # lets Prometheus see at least two scrapes of the canary before it is judged
  analysis:
    interval: 15s
    count: 3
    minSuccessRate: 0.95
    prometheusAddress: http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090

loadgen:
  # A pod that sends a steady trickle of requests so the analysis always has traffic to judge.
  enabled: false
  intervalSeconds: 0.2
