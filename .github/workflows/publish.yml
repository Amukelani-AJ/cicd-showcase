# Written by Amukelani (Claude Sonnet 5.5) on 2026-10-25 — Publish the image to GHCR on main and version tags, then smoke-test the pushed image
# Modified by Amukelani (Claude Sonnet 5.5) on 2026-10-25 — Pinned every action to a commit SHA (bumped to current majors); Dependabot keeps them fresh
# Modified by Amukelani (Claude Sonnet 5.5) on 2026-10-25 — Added keyless cosign signing, SBOM attestation, build provenance and self-verification
# Modified by Amukelani (Claude Sonnet 5.5) on 2026-10-25 — Added the promote job: commit the new image tag to deploy/values.yaml for Argo CD
name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false # never abort a push to the registry halfway

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push to GHCR with GITHUB_TOKEN
      id-token: write # keyless signing (Sigstore) and provenance via OIDC
      attestations: write # GitHub build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the pushed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run -d --name published -p 8000:8000 "${IMAGE}@${DIGEST}"
          for i in $(seq 1 15); do
            if body=$(curl -fsS http://127.0.0.1:8000/version); then
              echo "$body"
              echo "$body" | grep -q "${GITHUB_SHA}" && exit 0
              echo "git_sha in /version does not match ${GITHUB_SHA}"; exit 1
            fi
            sleep 1
          done
          docker logs published
          exit 1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM from the pushed image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom-release.cdx.json

      - name: Attach the SBOM as a signed attestation
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${IMAGE}@${DIGEST}"

      - name: Build provenance attestation (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify signature and SBOM attestation
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@${GITHUB_REF}"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" >/dev/null
          cosign verify-attestation "${IMAGE}@${DIGEST}" --type cyclonedx \
            --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" >/dev/null
          echo "signature and SBOM attestation verified for ${identity}"

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published"
            echo "- Image: \`${IMAGE}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Signed (cosign keyless), SBOM attested (CycloneDX), provenance attested (SLSA)"
            echo "- Tags:"
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    # GitOps hand-off: record the new image tag in Git. Argo CD does the actual deploy (D-012).
    # Commits pushed with GITHUB_TOKEN do not trigger workflows, so this cannot loop.
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: promote
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # the tip of main, which may be ahead of the commit that was built
      - name: Point deploy/values.yaml at the new image
        run: |
          tag="sha-${GITHUB_SHA:0:7}"
          sed -i -E "s/^([[:space:]]*tag:[[:space:]]*).*/\1${tag}/" deploy/values.yaml
          if git diff --quiet; then echo "deploy/values.yaml already at ${tag}"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy): promote ${tag}"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
