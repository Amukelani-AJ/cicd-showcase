# Written by Amukelani (Claude Sonnet 5.5) on 2026-10-25 — CI: compliance, lint, tests, image build (no push yet)
# TODO(P3): pin each `uses:` to a full commit SHA (run `pinact run`).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the compliance script diffs against origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compliance checks (PR)
        if: github.event_name == 'pull_request'
        run: python scripts/validate-compliance.py --strict --base origin/${{ github.base_ref }}
      - name: Compliance checks (push)
        if: github.event_name == 'push'
        run: python scripts/validate-compliance.py

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cicd-showcase:ci
          build-args: |
            APP_VERSION=ci
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 8000:8000 cicd-showcase:ci
          for i in $(seq 1 15); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1
