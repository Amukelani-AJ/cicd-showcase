# Written by Amukelani (Claude Sonnet 5.5) on 2026-10-25 — kind cluster config: single node, service exposed on localhost:8088
# Modified by Amukelani (Claude Sonnet 5.5) on 2026-10-25 — Host port 8088 because 8080 is already in use on the dev machine
# One control-plane node is enough for this project. NodePort 30080 is mapped to the host,
# so no ingress controller is needed (see D-010).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cicd
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080 # the chart's NodePort
        hostPort: 8088
        listenAddress: "127.0.0.1" # never expose the demo beyond this machine
        protocol: TCP
