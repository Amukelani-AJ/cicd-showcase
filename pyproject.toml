[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Attribution headers are long by design; `ruff format` wraps code.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov=dora --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
